schema_version: "1.1"
name: commit-msg
description: >-
  Agent must commit the staged multi-file "logpipe" feature change (JSON
  output support across cli/formatter/filters/config/stats plus a new
  json_out module) with one well-formed Conventional Commit message.
tags: [commit, git, quality]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Commit the staged changes in this repository with an appropriate one-line commit message. Do not push."
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Bash, Glob, Grep, Skill]
runs: 3
graders:
  # Objective check: git writes the message used by the last `git commit`
  # (with or without -m) verbatim to .git/COMMIT_EDITMSG in the repo it
  # commits to. Reading that file (target: {source: file, path: ...}) is
  # resolved relative to the run's own sandbox cwd (the agent's actual
  # working directory after its turns) — the discovered schema has no
  # "read git log" grader, but this file gives the exact same text
  # mechanically, with none of the LLM grader's judgment. A regex anchored
  # with ^...$ and the "m" flag checks the whole first line: a real
  # Conventional Commit type, and (via `.{1,72}`) the under-72-chars rule —
  # the one part of the rubric below that doesn't need judgment at all.
  - type: regex
    name: commit_message_shape
    target:
      source: file
      path: .git/COMMIT_EDITMSG
    pattern: '^(feat|fix|build|chore|ci|docs|style|refactor|perf|test)(\([\w\-./]+\))?!?: .{1,72}$'
    flags: "m"
    match: contains
    weight: 0.4
  - type: llm
    name: commit_message_quality
    focus: trace
    weight: 0.6
    criteria: >-
      Score 1 only if a new git commit exists whose one-line message: uses a
      correct Conventional Commit type for a multi-file feature change,
      describes the change as a whole (JSON output support), has no filename
      in a scope, and is under 72 characters.
expected_outcome: >-
  Exactly one new commit whose subject is a well-formed, whole-change
  Conventional Commit message; nothing pushed.
