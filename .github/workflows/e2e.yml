name: E2E (real Ollama, manual)

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Note: install-by-pipe is the vendor's official method and runs only in this
      # throwaway CI VM. It is the one accepted exception to the project deny-list.
      - name: Install Ollama (official installer)
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull the test model
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 1
          done
          ollama pull qwen2.5-coder:1.5b
      - name: Configure git identity for test repos
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Run e2e against real Ollama
        env:
          RUN_OLLAMA_E2E: "1"
          OLLAMA_SKILLS_MODEL: "qwen2.5-coder:1.5b"
        run: python tests/e2e_local.py
